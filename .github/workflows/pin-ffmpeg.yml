# Vigia o pin do ffmpeg — ver scripts/verificar-pin-ffmpeg.mjs e a ADR 0001.
#
# A URL pinada aponta para uma tag `autobuild-*` do BtbN, que e podada com o
# tempo. Sem este workflow, a descoberta viria de um usuario relatando que a
# primeira execucao falha — meses depois do commit que pinou.
#
# As actions abaixo sao pinadas por SHA, nao por tag: `@v4` e uma tag MOVEL —
# quem controla o repo da action pode reaponta-la a qualquer commit, e o
# workflow rodaria codigo novo sem nenhum commit nosso. Mesma logica que ja
# aplicamos ao pin do ffmpeg (ADR 0001). O comentario ao lado do SHA diz a
# versao; para atualizar, resolva a tag e troque o SHA no mesmo commit.
name: pin do ffmpeg

on:
  schedule:
    # Diario. O que se vigia aqui muda por acao de terceiro, nao por commit
    # nosso, entao rodar so em push nao adiantaria nada.
    - cron: '17 6 * * *'
  push:
    paths:
      - 'src/bootstrap/ffmpeg.ts'
      - 'scripts/verificar-pin-ffmpeg.mjs'
      - '.github/workflows/pin-ffmpeg.yml'
  workflow_dispatch:

# Minimo necessario: os dois jobs so fazem checkout e `fetch` de URL publica.
# Sem isto, o GITHUB_TOKEN herda o default do repo/org, que pode ser read-write.
permissions:
  contents: read

jobs:
  disponivel:
    name: a URL pinada ainda existe?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/verificar-pin-ffmpeg.mjs

  integridade:
    name: o pacote continua o mesmo?
    # ~167 MB: vale quando o pin muda ou sob demanda, nao todo dia.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/verificar-pin-ffmpeg.mjs --integridade
