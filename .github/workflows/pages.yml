# Publica a landing (docs/site/) no GitHub Pages.
#
# Por que um workflow em vez do modo "branch + pasta": o modo legado so aceita
# a raiz do repo ou /docs inteiro. /docs guarda a documentacao interna do
# projeto (ADRs, backlog, notas humano x LLM), que nao e site publico — e a
# landing usa caminhos relativos (styles.css, favicon.svg), entao precisa estar
# na RAIZ do site, nao em /site/. Publicar so docs/site/ resolve os dois.
#
# Actions pinadas por SHA pelo mesmo motivo dos outros workflows: tag e movel.
name: pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Minimo para publicar no Pages: ler o repo, escrever no Pages e provar a
# identidade do deploy (id-token) para o deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; nao cancela o que ja esta no ar (cancelar um deploy em
# andamento pode deixar o site fora).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar landing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
